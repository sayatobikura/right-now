<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --surface-0: #fdf6f0;
      --surface-1: #ffffff;
      --surface-2: #f5ebe3;
      --text-primary: #2c4a66;
      --text-secondary: #4e7a9e;
      --text-tertiary: #7ba3be;
      --accent: #5a9abf;
      --accent-hover: #3d82ad;
      --danger: #e87461;
      --success: #7cc9a0;
      --border: #edddd0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 400px;
      min-height: 240px;
      max-height: 580px;
      background: var(--surface-0);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      overflow-y: auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-1);
      position: sticky;
      top: 0;
    }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header .provider {
      font-size: 14px;
      color: var(--text-tertiary);
      cursor: pointer;
    }
    .header .provider:hover { color: var(--text-secondary); }

    /* Editor */
    .editor {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .editor textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 72px;
    }
    .editor textarea::placeholder { color: var(--text-tertiary); }
    .editor textarea:focus { border-color: var(--accent); }
    .editor-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .editor-hint { font-size: 14px; color: var(--text-tertiary); }

    /* Buttons */
    .btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }
    .btn-ghost {
      background: none;
      color: var(--text-secondary);
      padding: 4px 8px;
    }
    .btn-ghost:hover { color: var(--text-primary); }

    /* Status */
    .status {
      padding: 6px 16px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status.organizing { color: var(--accent); }
    .status.error { color: var(--danger); background: rgba(239,68,68,0.08); }
    .status.success { color: var(--success); }
    .spinner {
      width: 10px; height: 10px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Notes list */
    .notes-header {
      padding: 8px 16px 4px;
      font-size: 14px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .note-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: default;
    }
    .note-item:hover { background: var(--surface-1); }
    .note-content {
      font-size: 14px;
      color: var(--text-primary);
      white-space: pre-wrap;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .note-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .note-tag {
      font-size: 14px;
      color: var(--text-tertiary);
      background: var(--surface-2);
      padding: 1px 5px;
      border-radius: 3px;
    }
    .note-category {
      font-size: 14px;
      color: var(--accent);
      font-weight: 500;
    }
    .note-time {
      font-size: 14px;
      color: var(--text-tertiary);
    }
    .note-delete {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
    }
    .note-delete:hover { color: var(--danger); }

    /* Tab bar */
    .tab-bar {
      display: flex;
      gap: 4px;
      padding: 0 16px 8px;
      background: var(--surface-1);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 6px 8px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: var(--surface-2);
      color: var(--text-secondary);
      transition: all 0.15s;
    }
    .tab.active { background: var(--accent); color: white; }
    .tab-badge-red {
      font-size: 11px;
      background: var(--danger);
      color: white;
      padding: 0 4px;
      border-radius: 8px;
      margin-left: 2px;
    }
    .section-label {
      padding: 8px 16px 4px;
      font-size: 14px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .today-item { display: flex; align-items: flex-start; gap: 8px; }
    .item-body { flex: 1; min-width: 0; }
    .type-icon { font-size: 14px; margin-top: 2px; flex-shrink: 0; width: 18px; text-align: center; }
    .check {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--border); background: none;
      cursor: pointer; flex-shrink: 0; margin-top: 2px;
      transition: all 0.15s;
    }
    .check:hover { border-color: var(--accent); }
    .check.checked { background: var(--success); border-color: var(--success); }
    .note-content.done { text-decoration: line-through; color: var(--text-tertiary); }
    .badge {
      font-size: 11px; padding: 1px 5px; border-radius: 3px; font-weight: 500;
    }
    .badge-overdue { background: rgba(232,116,97,0.15); color: #d05a48; }
    .badge-warning { background: rgba(240,198,116,0.15); color: #c9a045; }
    .badge-default { background: var(--surface-2); color: var(--text-secondary); }
    .note-item { display: flex; align-items: flex-start; gap: 8px; }
    .note-item .item-body { flex: 1; min-width: 0; }
    .pill-group { display: flex; flex-wrap: wrap; gap: 4px; }
    .pill {
      font-size: 14px; padding: 2px 8px; border-radius: 4px;
      border: none; cursor: pointer; transition: all 0.15s;
    }
    .pill:hover { opacity: 0.8; }

    /* Setup */
    .setup {
      padding: 24px 16px;
      text-align: center;
    }
    .setup h2 { font-size: 16px; margin-bottom: 4px; }
    .setup p { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; }
    .setup-providers {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .setup-providers button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .setup-providers button.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .setup input[type="password"],
    .setup input[type="text"] {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      margin-bottom: 8px;
    }
    .setup input:focus { border-color: var(--accent); }
    .setup .help {
      font-size: 14px;
      color: var(--text-tertiary);
      margin-top: 12px;
    }
    .setup .help a { color: var(--accent); }

    /* OAuth button */
    .btn-oauth {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    .btn-oauth:hover { border-color: var(--accent); }
    .btn-oauth svg { flex-shrink: 0; }
    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span { font-size: 14px; color: var(--text-tertiary); }
    .oauth-status {
      font-size: 14px;
      color: var(--success);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Empty */
    .empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="oauth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
